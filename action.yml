name: Sentry Bugbot
description: Pulls fresh Sentry issues and opens PRs that fix them using AI.
author: thiagocordeiro
branding:
  icon: alert-triangle
  color: orange
inputs:
  agent:
    description: Coding agent to use. One of "claude" or "codex".
    required: true
  token:
    description: API key for the selected agent (`ANTHROPIC_API_KEY` for `claude` via the Anthropic API, `OPENAI_API_KEY` for `codex`). Mutually exclusive with `claudeOauthToken`.
    required: false
  claudeOauthToken:
    description: Claude Code OAuth token from `claude setup-token` (binds the run to your Pro/Max subscription instead of the Anthropic API). Only valid when `agent: claude`. Mutually exclusive with `token`.
    required: false
  sentry:
    description: |
      YAML/JSON block with Sentry config. Example:
        sentry: |
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          org: my-org
          project: my-project
          url: https://sentry.io   # optional, defaults to https://sentry.io
    required: true
  maxIssues:
    description: Maximum number of issues to attempt per run.
    required: false
    default: "5"
  baseBranch:
    description: Branch PRs target. Defaults to the repository default branch.
    required: false
    default: ""
  githubToken:
    description: GitHub token used for pushing branches and creating PRs.
    required: false
    default: ${{ github.token }}
  dryRun:
    description: If true, skip push/PR and reset the branch.
    required: false
    default: "false"
runs:
  using: node20
  main: dist/index.js

name: Sentry Bugbot
description: Pulls fresh Sentry issues and opens PRs that fix them using AI.
author: thiagocordeiro
branding:
  icon: alert-triangle
  color: orange
inputs:
  agent:
    description: Coding agent to use. One of "claude" or "codex".
    required: true
  credentials-type:
    description: |
      Credentials kind. One of "api-key" or "auth_token".
      `api-key` maps to ANTHROPIC_API_KEY (claude) or OPENAI_API_KEY (codex).
      `auth_token` maps to CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`
      and binds the run to a Claude Pro/Max subscription. Only valid for claude.
    required: true
  credentials-token:
    description: API key or OAuth token for the selected agent.
    required: true
  sentry-token:
    description: Sentry auth token (event:read, project:read, org:read).
    required: true
  sentry-org:
    description: Sentry organization slug.
    required: true
  sentry-project:
    description: Sentry project slug.
    required: true
  sentry-url:
    description: Sentry base URL (for self-hosted). Defaults to https://sentry.io.
    required: false
    default: "https://sentry.io"
  max-issues:
    description: Maximum number of issues to attempt per run.
    required: false
    default: "5"
  additional-instructions:
    description: |
      Extra free-form instructions appended to the agent prompt. Useful for
      enforcing project conventions (commit message format, test framework,
      code style, files to avoid, etc.).
    required: false
    default: ""
  base-branch:
    description: Branch PRs target. Defaults to the repository default branch.
    required: false
    default: ""
  github-token:
    description: GitHub token used for pushing branches and creating PRs.
    required: false
    default: ${{ github.token }}
  dry-run:
    description: If true, skip push/PR and reset the branch.
    required: false
    default: "false"
runs:
  using: node20
  main: dist/index.cjs

name: Sentry Bugbot
description: Pulls fresh Sentry issues and opens PRs that fix them using AI.
author: thiagocordeiro
branding:
  icon: alert-triangle
  color: orange
inputs:
  agent:
    description: Coding agent to use. One of "claude" or "codex".
    required: true
  credentials:
    description: |
      YAML/JSON block with agent credentials. Example:
        credentials: |
          type: api-key        # or "auth_token" (claude only)
          token: ${{ secrets.ANTHROPIC_API_KEY }}
      `api-key` maps to ANTHROPIC_API_KEY (claude) or OPENAI_API_KEY (codex).
      `auth_token` maps to CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`
      and binds the run to a Claude Pro/Max subscription. Only valid for claude.
    required: true
  sentry:
    description: |
      YAML/JSON block with Sentry config. Example:
        sentry: |
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          org: my-org
          project: my-project
          url: https://sentry.io   # optional, defaults to https://sentry.io
    required: true
  maxIssues:
    description: Maximum number of issues to attempt per run.
    required: false
    default: "5"
  baseBranch:
    description: Branch PRs target. Defaults to the repository default branch.
    required: false
    default: ""
  githubToken:
    description: GitHub token used for pushing branches and creating PRs.
    required: false
    default: ${{ github.token }}
  dryRun:
    description: If true, skip push/PR and reset the branch.
    required: false
    default: "false"
runs:
  using: node20
  main: dist/index.js
